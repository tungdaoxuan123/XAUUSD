[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-xauusd-trading"
version = "1.0.0"
description = "AI-Driven XAUUSD Trading System with Ensemble RL and Market Regime Adaptation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "JonusNattapong / Zombitx64", email = "jonusnattapong@zombitx64.com"}
]
maintainers = [
    {name = "JonusNattapong / Zombitx64", email = "jonusnattapong@zombitx64.com"}
]
keywords = [
    "trading",
    "reinforcement-learning",
    "machine-learning",
    "finance",
    "forex",
    "gold",
    "xauusd",
    "algorithmic-trading",
    "ensemble-learning",
    "market-regime",
    "risk-management",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "stable-baselines3==2.1.0",
    "gymnasium==0.29.1",
    "torch==2.1.0",
    "numpy==1.24.3",
    "pandas==2.1.4",
    "scikit-learn==1.3.2",
    "yfinance==0.2.18",
    "requests==2.31.0",
    "matplotlib==3.8.2",
    "seaborn==0.13.0",
    "plotly==5.17.0",
    "python-dotenv==1.0.0",
    "tqdm==4.66.1",
    "joblib==1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
gpu = [
    "torch>=2.1.0",  # GPU version
    "tensorflow[and-cuda]>=2.15.0",
]
optimization = [
    "optuna>=3.4.0",
    "jax>=0.4.20",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/JonusNattapong/AI-XAUUSD-Trading"
Repository = "https://github.com/JonusNattapong/AI-XAUUSD-Trading"
Documentation = "https://jonusnattapong.github.io/AI-XAUUSD-Trading"
"Bug Reports" = "https://github.com/JonusNattapong/AI-XAUUSD-Trading/issues"
"White Paper" = "https://github.com/JonusNattapong/AI-XAUUSD-Trading/blob/main/AI_XAUUSD_Trading_White_Paper.pdf"
HuggingFace = "https://huggingface.co/JonusNattapong/AI-XAUUSD-Trading"

[project.scripts]
ai-trading-demo = "ai_xauusd_trading.demos:run_quick_demo"
ai-live-trading = "ai_xauusd_trading.live_trading:start_live_trading"
ai-regime-analysis = "ai_xauusd_trading.analysis:analyze_market_regime"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "notebooks*"]

[tool.setuptools.package-data]
"ai_xauusd_trading" = ["models/*", "config/*", "data/*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "stable_baselines3.*",
    "gymnasium.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["ai_xauusd_trading"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]